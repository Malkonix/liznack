name: liznack
description: "Liznack: ventas e inventario para un emprendimiento de golosinas."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  http: ^1.2.2
  path: ^1.9.0
  pub_semver: ^2.2.0
  shared_preferences: ^2.3.2
  sqflite: ^2.4.1
  uuid: ^4.5.1
  pdf: ^3.13.1
  printing: ^5.15.1

# shared_preferences_android 2.5 pasa a llamar al plugin por JNI y el R8 del
# build release borra clases de Kotlin: la app queda en el splash con
# NoSuchMethodError / ClassNotFoundException. La 2.4.28 usa MethodChannel.
# Es la última 2.4.x, compatible con shared_preferences 2.5.
dependency_overrides:
  shared_preferences_android: 2.4.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
